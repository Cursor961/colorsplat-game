<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Stopwatch icon for Endless mode -->
  <g fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top button -->
    <rect x="54" y="8" width="20" height="12" rx="3"/>
    <!-- Main circle -->
    <circle cx="64" cy="72" r="44"/>
    <!-- Minute hand -->
    <line x1="64" y1="72" x2="64" y2="44"/>
    <!-- Hour hand -->
    <line x1="64" y1="72" x2="82" y2="62"/>
    <!-- Center dot -->
    <circle cx="64" cy="72" r="3" fill="white"/>
  </g>
</svg>
