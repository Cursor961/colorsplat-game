<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Radial gradient: bright center → transparent edges (overall fade) -->
    <radialGradient id="rayFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Softer, wider version for side-fade halo layer -->
    <radialGradient id="haloFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(200,200)">
    <!-- Layer 1: Wide soft halo rays (side-fade effect) -->
    <g fill="url(#haloFade)" opacity="0.7">
      <polygon points="0,0  -38,-190  38,-190"/>
      <polygon points="0,0  -38,-190  38,-190" transform="rotate(30)"/>
      <polygon points="0,0  -38,-190  38,-190" transform="rotate(60)"/>
      <polygon points="0,0  -38,-190  38,-190" transform="rotate(90)"/>
      <polygon points="0,0  -38,-190  38,-190" transform="rotate(120)"/>
      <polygon points="0,0  -38,-190  38,-190" transform="rotate(150)"/>
      <polygon points="0,0  -38,-190  38,-190" transform="rotate(180)"/>
      <polygon points="0,0  -38,-190  38,-190" transform="rotate(210)"/>
      <polygon points="0,0  -38,-190  38,-190" transform="rotate(240)"/>
      <polygon points="0,0  -38,-190  38,-190" transform="rotate(270)"/>
      <polygon points="0,0  -38,-190  38,-190" transform="rotate(300)"/>
      <polygon points="0,0  -38,-190  38,-190" transform="rotate(330)"/>
    </g>
    <!-- Layer 2: Core sharp rays -->
    <g fill="url(#rayFade)">
      <polygon points="0,0  -18,-180  18,-180"/>
      <polygon points="0,0  -18,-180  18,-180" transform="rotate(30)"/>
      <polygon points="0,0  -18,-180  18,-180" transform="rotate(60)"/>
      <polygon points="0,0  -18,-180  18,-180" transform="rotate(90)"/>
      <polygon points="0,0  -18,-180  18,-180" transform="rotate(120)"/>
      <polygon points="0,0  -18,-180  18,-180" transform="rotate(150)"/>
      <polygon points="0,0  -18,-180  18,-180" transform="rotate(180)"/>
      <polygon points="0,0  -18,-180  18,-180" transform="rotate(210)"/>
      <polygon points="0,0  -18,-180  18,-180" transform="rotate(240)"/>
      <polygon points="0,0  -18,-180  18,-180" transform="rotate(270)"/>
      <polygon points="0,0  -18,-180  18,-180" transform="rotate(300)"/>
      <polygon points="0,0  -18,-180  18,-180" transform="rotate(330)"/>
    </g>
    <!-- Layer 3: Bright center glow -->
    <circle cx="0" cy="0" r="25" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>
